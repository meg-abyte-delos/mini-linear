name: CI
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci_super, POSTGRES_DB: mini_linear }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGSUPER_URL: postgres://postgres:ci_super@localhost:5432/mini_linear
      DATABASE_OWNER_URL: postgres://owner:ci_only@localhost:5432/mini_linear
      DATABASE_URL: postgres://app_user:ci_app@localhost:5432/mini_linear
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install --no-frozen-lockfile  # switch to --frozen-lockfile once pnpm-lock.yaml is committed (S9)
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - name: Bootstrap roles (superuser only here; migrations run as a NON-superuser owner, like prod)
        run: |
          psql "$PGSUPER_URL" -c "CREATE ROLE owner LOGIN PASSWORD 'ci_only' NOSUPERUSER NOBYPASSRLS CREATEROLE"
          psql "$PGSUPER_URL" -c "ALTER DATABASE mini_linear OWNER TO owner"
          psql "$PGSUPER_URL" -v owner=owner -f db/bootstrap-roles.sql
      - name: Migrate as owner, then set app_user password
        run: |
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f db/migrations/0000_m1_auth_tenancy.sql
          psql "$PGSUPER_URL" -c "ALTER ROLE app_user PASSWORD 'ci_app'"
      - run: pnpm test
      - run: pnpm check:rls
      - run: pnpm build
