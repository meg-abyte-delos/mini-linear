name: CI
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  e2e-api:
    # API-mode e2e: real Postgres + real sessions (ML_API=1, no ML_DEV_AUTH) on the demo seed. Needs `pnpm db:seed-demo` (PR #116).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci_super, POSTGRES_DB: mini_linear }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGSUPER_URL: postgres://postgres:ci_super@localhost:5432/mini_linear
      DATABASE_OWNER_URL: postgres://owner:ci_only@localhost:5432/mini_linear
      DATABASE_URL: postgres://app_user:ci_only_app@localhost:5432/mini_linear
      SESSION_SECRET: ci-only-session-secret-not-for-prod-0123456789
      CURSOR_SECRET: ci-only-cursor-secret-not-for-prod-0123456789
      ML_API: "1"
      ML_WORKSPACE_SLUG: demo
      ML_TEAM_ID: "00000000-0000-4000-8000-000000000003" # fixed id from scripts/seed-demo.mts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Install psql
        run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Bootstrap roles
        run: |
          psql "$PGSUPER_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE owner LOGIN PASSWORD 'ci_only' NOSUPERUSER NOBYPASSRLS CREATEROLE"
          psql "$PGSUPER_URL" -v ON_ERROR_STOP=1 -c "ALTER DATABASE mini_linear OWNER TO owner"
          psql "$PGSUPER_URL" -v ON_ERROR_STOP=1 -v owner=owner -f db/bootstrap-roles.sql
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f db/roles/001_app_user.sql
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE app_user PASSWORD 'ci_only_app'"
      - name: Migrate (psql, as owner) then grants
        run: |
          for f in db/migrations/*.sql; do psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f "$f"; done
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f db/roles/900_grants.sql
      - name: Seed demo workspace (run twice to prove idempotence)
        env: { SEED_DEMO_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}', E2E_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}' }
        run: |
          pnpm db:seed-demo
          pnpm db:seed-demo
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: API-mode e2e (Playwright starts `pnpm start` with the env above)
        env: { SEED_DEMO_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}', E2E_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}' }
        run: pnpm exec playwright test tests/e2e/core-flow.spec.ts tests/e2e/auth.spec.ts tests/e2e/search-inbox-api.spec.ts tests/e2e/bulk-actions-api.spec.ts tests/e2e/presence.spec.ts
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci_super, POSTGRES_DB: mini_linear }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGSUPER_URL: postgres://postgres:ci_super@localhost:5432/mini_linear
      DATABASE_OWNER_URL: postgres://owner:ci_only@localhost:5432/mini_linear
      DATABASE_URL: postgres://app_user:ci_only_app@localhost:5432/mini_linear
      TEST_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-not-for-prod-0123456789
      CURSOR_SECRET: ci-only-cursor-secret-not-for-prod-0123456789
      TEST_BASE_URL_2: http://localhost:3001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'src/**', 'lib/**', 'components/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --no-frozen-lockfile  # switch to --frozen-lockfile once pnpm-lock.yaml is committed (S9)
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - name: Install psql
        run: sudo apt-get install -y -qq postgresql-client >/dev/null
      # Order (Rex review of #1+#3): superuser bootstrap -> app_user role -> raw SQL migration -> grants -> check:rls.
      # Migrations are applied with psql (raw SQL, ON_ERROR_STOP), NOT drizzle-kit migrate: the drizzle journal
      # is intentionally unused, so there is a single source of truth (db/migrations/*.sql in lexical order).
      - name: Bootstrap roles (superuser only here; migrations run as a NON-superuser owner, like prod)
        run: |
          psql "$PGSUPER_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE owner LOGIN PASSWORD 'ci_only' NOSUPERUSER NOBYPASSRLS CREATEROLE"
          psql "$PGSUPER_URL" -v ON_ERROR_STOP=1 -c "ALTER DATABASE mini_linear OWNER TO owner"
          psql "$PGSUPER_URL" -v ON_ERROR_STOP=1 -v owner=owner -f db/bootstrap-roles.sql
      - name: Create app_user (owner)
        run: |
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f db/roles/001_app_user.sql
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE app_user PASSWORD 'ci_only_app'"
      - name: Migrate (psql, as owner) then grants
        run: |
          for f in db/migrations/*.sql; do psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f "$f"; done
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f db/roles/900_grants.sql
      - run: pnpm check:rls
      - name: Seed demo workspace (idempotent; run twice to prove it)
        env: { SEED_DEMO_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}', E2E_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}' }
        run: |
          pnpm db:seed-demo
          pnpm db:seed-demo
      - run: pnpm build
      - name: Start app (2 instances, for T6 cross-instance rate limit)
        run: |
          PORT=3000 TRUSTED_PROXIES=127.0.0.1 ML_ALLOW_SHARED_RATELIMIT_BUCKET=1 ML_WEBHOOKS_ALLOW_PRIVATE=1 nohup pnpm start > app1.log 2>&1 &
          PORT=3001 TRUSTED_PROXIES=127.0.0.1 ML_ALLOW_SHARED_RATELIMIT_BUCKET=1 ML_WEBHOOKS_ALLOW_PRIVATE=1 nohup pnpm start > app2.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3000 && curl -s -o /dev/null http://localhost:3001 && exit 0
            sleep 1
          done
          echo "app did not come up within 60 s"; tail -n 50 app1.log app2.log; exit 1
      - run: pnpm test
      - name: Coverage report (non-blocking)
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/, if-no-files-found: ignore }
      - name: App logs
        if: always()
        run: tail -n 120 app1.log || true
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Stop integration servers (Playwright starts its own on :3000)
        run: fuser -k 3000/tcp 3001/tcp || true
      - name: e2e (mock + API specs)
        env: { SEED_DEMO_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}', E2E_PASSWORD: '${{ secrets.SEED_DEMO_PASSWORD }}' }
        run: pnpm test:e2e
