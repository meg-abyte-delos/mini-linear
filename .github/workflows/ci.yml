name: CI
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: mini_linear }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_OWNER_URL: postgres://owner:ci_only@localhost:5432/mini_linear
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile  # switch to --frozen-lockfile once pnpm-lock.yaml is committed (S9)
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:rls
      - run: pnpm build
